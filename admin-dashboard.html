<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAASITEK Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .admin-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .admin-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .admin-card input,
    .admin-card select {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    #message {
      margin: 15px 0;
    }

    @media (max-width: 650px) {
      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="admin-container">

    <div class="admin-header">
      <div>
        <a class="brand" href="index.html">
          <span>CT</span> CAASITEK
        </a>
        <h1>Admin Dashboard</h1>
        <p>Manage your CAASITEK products and prices.</p>
      </div>

      <button id="logoutButton">
        Log Out
      </button>
    </div>

    <p id="message"></p>

    <section class="admin-card">
      <h2>Add Product</h2>

      <form id="productForm">

        <label for="name">Product Name</label>
        <input
          id="name"
          type="text"
          placeholder="e.g. iPhone 17 Pro Max"
          required
        >

        <label for="category">Category</label>
        <input
          id="category"
          type="text"
          placeholder="e.g. iPhone"
          required
        >

        <label for="price">Price</label>
        <input
          id="price"
          type="number"
          placeholder="e.g. 28000"
          required
        >

        <button type="submit">
          Add Product
        </button>

      </form>
    </section>

    <section class="admin-card">
      <h2>Current Products</h2>

      <div id="products">
        Loading products...
      </div>
    </section>

  </main>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://njvagupehnpmzjxjebfy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_My7phM94P5foLkK565nkXw_Pj8DlShZ";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const message = document.getElementById("message");
    const productsContainer = document.getElementById("products");
    const productForm = document.getElementById("productForm");
    const logoutButton = document.getElementById("logoutButton");

    async function checkUser() {

      const {
        data: { user }
      } = await supabase.auth.getUser();

      if (!user) {
        window.location.href = "admin.html";
        return null;
      }

      if (user.email !== "isaacmwale3024@icloud.com") {
        await supabase.auth.signOut();
        window.location.href = "admin.html";
        return null;
      }

      return user;
    }

    async function loadProducts() {

      productsContainer.textContent = "Loading products...";

      const { data, error } = await supabase
        .from("products")
        .select("*")
        .order("name");

      if (error) {
        productsContainer.textContent =
          "Unable to load products: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        productsContainer.textContent =
          "No products found.";
        return;
      }

      productsContainer.innerHTML = "";

      data.forEach(product => {

        const item = document.createElement("div");
        item.className = "product";

        item.innerHTML = `
          <div>
            <strong>${product.name}</strong>
            <div>${product.category || ""}</div>
            <div>K${Number(product.price || 0).toLocaleString()}</div>
          </div>

          <div class="product-actions">
            <button data-id="${product.id}" class="delete-button">
              Delete
            </button>
          </div>
        `;

        productsContainer.appendChild(item);
      });

      document.querySelectorAll(".delete-button")
        .forEach(button => {

          button.addEventListener("click", async () => {

            const confirmed =
              confirm("Delete this product?");

            if (!confirmed) return;

            const { error } = await supabase
              .from("products")
              .delete()
              .eq("id", button.dataset.id);

            if (error) {
              message.textContent =
                "Delete failed: " + error.message;
              return;
            }

            message.textContent =
              "Product deleted.";

            loadProducts();
          });

        });
    }

    productForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const category =
        document.getElementById("category").value.trim();

      const price =
        Number(document.getElementById("price").value);

      if (!name || !category || !price) {
        message.textContent =
          "Please complete all fields.";

        return;
      }

      const { error } = await supabase
        .from("products")
        .insert({
          name,
          category,
          price
        });

      if (error) {

        message.textContent =
          "Could not add product: " + error.message;

        return;
      }

      message.textContent =
        "Product added successfully.";

      productForm.reset();

      loadProducts();
    });

    logoutButton.addEventListener("click", async () => {

      await supabase.auth.signOut();

      window.location.href = "admin.html";

    });

    const user = await checkUser();

    if (user) {
      loadProducts();
    }

  </script>

</body>
</html>
