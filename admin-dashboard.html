<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CAASITEK Admin Dashboard</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main style="max-width:1000px;margin:40px auto;padding:20px;">

    <!-- ADMIN PROFILE / LOGO -->
    <section style="
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:30px;
      padding:18px;
      border-radius:16px;
      background:#fff;
      box-shadow:0 4px 20px rgba(0,0,0,.08);
    ">

      <img
        id="adminLogo"
        src=""
        alt="CAASITEK Logo"
        style="
          width:70px;
          height:70px;
          object-fit:contain;
          border-radius:50%;
          border:2px solid #f28c00;
          background:#fff;
        "
      >

      <div>
        <h1 style="margin:0;">CAASITEK Admin</h1>

        <p style="margin:6px 0 10px;color:#666;">
          Manage your products and online store.
        </p>

        <label
          for="logoInput"
          style="
            display:inline-block;
            padding:9px 14px;
            background:#f28c00;
            color:#fff;
            border-radius:8px;
            cursor:pointer;
          "
        >
          Upload Logo
        </label>

        <input
          id="logoInput"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          style="display:none;"
        >

        <p
          id="logoMessage"
          style="margin:8px 0 0;color:#666;"
        ></p>
      </div>

      <button
        id="logoutButton"
        style="
          margin-left:auto;
          padding:10px 18px;
          border:0;
          border-radius:8px;
          cursor:pointer;
        "
      >
        Logout
      </button>

    </section>


    <!-- ADD / EDIT PRODUCT -->
    <section style="
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 4px 20px rgba(0,0,0,.08);
      margin-bottom:30px;
    ">

      <h2 id="formTitle">Add Product</h2>

      <form id="productForm">

        <input type="hidden" id="productId">

        <label>Product Name</label>

        <input
          id="name"
          type="text"
          required
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Category</label>

        <input
          id="category"
          type="text"
          placeholder="iPhone, Samsung, Accessories..."
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Price</label>

        <input
          id="price"
          type="number"
          required
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Storage</label>

        <input
          id="storage"
          type="text"
          placeholder="128GB, 256GB..."
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Condition</label>

        <input
          id="condition"
          type="text"
          placeholder="Brand New, Open Box, Used..."
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Warranty</label>

        <input
          id="warranty"
          type="text"
          placeholder="1 Year, 6 Months..."
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <label>Stock</label>

        <input
          id="stock"
          type="number"
          value="1"
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        >


        <!-- PRODUCT IMAGE UPLOAD -->

        <label>Product Image</label>

        <input
          id="imageFile"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          style="
            display:block;
            width:100%;
            padding:12px;
            margin:8px 0 10px;
            box-sizing:border-box;
          "
        >

        <img
          id="imagePreview"
          src=""
          alt="Product preview"
          style="
            display:none;
            width:140px;
            height:140px;
            object-fit:contain;
            border-radius:12px;
            margin-bottom:16px;
            border:1px solid #ddd;
          "
        >

        <input
          id="image"
          type="hidden"
        >


        <label>Description</label>

        <textarea
          id="description"
          rows="4"
          style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;"
        ></textarea>


        <label style="display:block;margin-bottom:12px;">
          <input id="featured" type="checkbox">
          Featured product
        </label>


        <label style="display:block;margin-bottom:18px;">
          <input id="active" type="checkbox" checked>
          Active / visible on website
        </label>


        <button
          type="submit"
          id="saveButton"
          style="
            padding:12px 22px;
            border:0;
            border-radius:8px;
            cursor:pointer;
          "
        >
          Save Product
        </button>


        <button
          type="button"
          id="cancelButton"
          style="
            padding:12px 22px;
            border:0;
            border-radius:8px;
            cursor:pointer;
            margin-left:8px;
          "
        >
          Cancel
        </button>


        <p id="message"></p>

      </form>

    </section>


    <!-- PRODUCTS -->

    <section>

      <h2>Products</h2>

      <div id="productsContainer">
        Loading products...
      </div>

    </section>

  </main>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://njvagupehnpmzjxjebfy.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_My7phM94P5foLkK565nkXw_Pj8DlShZ";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const ADMIN_EMAIL =
      "isaacmwale3024@icloud.com";


    const STORAGE_BUCKET =
      "product-images";


    const form =
      document.getElementById("productForm");


    const productsContainer =
      document.getElementById("productsContainer");


    const message =
      document.getElementById("message");


    const saveButton =
      document.getElementById("saveButton");


    const logoutButton =
      document.getElementById("logoutButton");


    const cancelButton =
      document.getElementById("cancelButton");


    const adminLogo =
      document.getElementById("adminLogo");


    const logoInput =
      document.getElementById("logoInput");


    const logoMessage =
      document.getElementById("logoMessage");


    const imageFile =
      document.getElementById("imageFile");


    const imagePreview =
      document.getElementById("imagePreview");


    const image =
      document.getElementById("image");


    const LOGO_PATH =
      "site-logo.png";


    const LOGO_URL =
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      STORAGE_BUCKET +
      "/" +
      LOGO_PATH;


    async function checkUser() {

      const {
        data,
        error
      } = await supabase.auth.getUser();


      if (error || !data.user) {

        window.location.href =
          "admin.html";

        return null;
      }


      if (
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        await supabase.auth.signOut();

        window.location.href =
          "admin.html";

        return null;
      }


      return data.user;

    }


    function loadLogo() {

      adminLogo.src =
        LOGO_URL +
        "?v=" +
        Date.now();

    }


    // LOGO UPLOAD

    logoInput.addEventListener(
      "change",
      async () => {

        const file =
          logoInput.files[0];


        if (!file) return;


        if (
          ![
            "image/png",
            "image/jpeg",
            "image/webp"
          ].includes(file.type)
        ) {

          logoMessage.textContent =
            "Please choose a PNG, JPG or WEBP image.";

          return;

        }


        logoMessage.textContent =
          "Uploading logo...";


        const {
          error
        } = await supabase
          .storage
          .from(STORAGE_BUCKET)
          .upload(
            LOGO_PATH,
            file,
            {
              upsert:true,
              contentType:file.type
            }
          );


        if (error) {

          console.error(error);

          logoMessage.textContent =
            "Logo upload failed: " +
            error.message;

          return;

        }


        logoMessage.textContent =
          "Logo uploaded successfully.";


        adminLogo.src =
          LOGO_URL +
          "?v=" +
          Date.now();

      }
    );


    // PRODUCT IMAGE PREVIEW

    imageFile.addEventListener(
      "change",
      () => {

        const file =
          imageFile.files[0];


        if (!file) return;


        const url =
          URL.createObjectURL(file);


        imagePreview.src =
          url;


        imagePreview.style.display =
          "block";

      }
    );


    // PRODUCT IMAGE UPLOAD

    async function uploadProductImage(file) {

      if (!file) return null;


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        "product-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,8) +
        "." +
        extension;


      const {
        error
      } = await supabase
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          fileName,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );


      if (error) {

        throw error;

      }


      const {
        data
      } = supabase
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(fileName);


      return data.publicUrl;

    }


    async function loadProducts() {

      productsContainer.innerHTML =
        "Loading products...";


      const {
        data,
        error
      } = await supabase
        .from("products")
        .select("*")
        .order("created_at", {
          ascending:false
        });


      if (error) {

        console.error(error);

        productsContainer.innerHTML =
          "Unable to load products: " +
          error.message;

        return;

      }


      if (!data || data.length === 0) {

        productsContainer.innerHTML =
          "No products found.";

        return;

      }


      productsContainer.innerHTML =
        data.map(product => `

          <article style="
            background:#fff;
            padding:20px;
            margin-bottom:15px;
            border-radius:14px;
            box-shadow:0 3px 15px rgba(0,0,0,.07);
          ">

            <div style="
              display:flex;
              gap:18px;
              align-items:center;
            ">

              ${
                product.image
                ?
                `<img
                  src="${product.image}"
                  alt="${product.name}"
                  style="
                    width:90px;
                    height:90px;
                    object-fit:contain;
                    border-radius:10px;
                  "
                >`
                :
                `<div style="
  width:90px;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
  border-radius:10px;
">
  <img
    src="${LOGO_URL}"
    alt="CAASITEK Electronics"
    style="
      width:70px;
      height:70px;
      object-fit:contain;
    "
  >
</div>`
              }


              <div style="flex:1;">

                <h3 style="margin:0 0 6px;">
                  ${product.name}
                </h3>


                <strong>
                  K${Number(product.price || 0).toLocaleString()}
                </strong>


                <p style="margin:6px 0;color:#666;">

                  ${product.storage || ""}

                  ${
                    product.condition
                    ? " • " + product.condition
                    : ""
                  }

                </p>


                <p style="margin:6px 0;">

                  ${
                    product.active
                    ? "🟢 Active"
                    : "🔴 Hidden"
                  }

                  ${
                    product.featured
                    ? " • ⭐ Featured"
                    : ""
                  }

                </p>

              </div>

            </div>


            <div style="
              display:flex;
              gap:8px;
              flex-wrap:wrap;
              margin-top:15px;
            ">


              <button
                onclick="editProduct('${product.id}')"
                style="padding:9px 14px;cursor:pointer;"
              >
                Edit
              </button>


              <button
                onclick="toggleActive('${product.id}', ${product.active})"
                style="padding:9px 14px;cursor:pointer;"
              >
                ${product.active ? "Hide" : "Activate"}
              </button>


              <button
                onclick="toggleFeatured('${product.id}', ${product.featured})"
                style="padding:9px 14px;cursor:pointer;"
              >
                ${product.featured ? "Unfeature" : "Feature"}
              </button>


              <button
                onclick="deleteProduct('${product.id}')"
                style="padding:9px 14px;cursor:pointer;"
              >
                Delete
              </button>


            </div>

          </article>

        `).join("");

    }


    window.editProduct =
      async function(id) {

        const {
          data,
          error
        } = await supabase
          .from("products")
          .select("*")
          .eq("id", id)
          .single();


        if (error) {

          alert(error.message);

          return;

        }


        document.getElementById("productId").value =
          data.id;


        document.getElementById("name").value =
          data.name || "";


        document.getElementById("category").value =
          data.category || "";


        document.getElementById("price").value =
          data.price || "";


        document.getElementById("storage").value =
          data.storage || "";


        document.getElementById("condition").value =
          data.condition || "";


        document.getElementById("warranty").value =
          data.warranty || "";


        document.getElementById("stock").value =
          data.stock || 0;


        document.getElementById("image").value =
          data.image || "";


        document.getElementById("description").value =
          data.description || "";


        document.getElementById("featured").checked =
          !!data.featured;


        document.getElementById("active").checked =
          !!data.active;


        if (data.image) {

          imagePreview.src =
            data.image;

          imagePreview.style.display =
            "block";

        } else {

          imagePreview.style.display =
            "none";

        }


        document.getElementById("formTitle").textContent =
          "Edit Product";


        saveButton.textContent =
          "Update Product";


        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };


    window.toggleActive =
      async function(id,current) {

        const {
          error
        } = await supabase
          .from("products")
          .update({
            active:!current,
            updated_at:
              new Date().toISOString()
          })
          .eq("id",id);


        if (error) {

          alert(error.message);

          return;

        }


        await loadProducts();

      };


    window.toggleFeatured =
      async function(id,current) {

        const {
          error
        } = await supabase
          .from("products")
          .update({
            featured:!current,
            updated_at:
              new Date().toISOString()
          })
          .eq("id",id);


        if (error) {

          alert(error.message);

          return;

        }


        await loadProducts();

      };


    window.deleteProduct =
      async function(id) {

        if (
          !confirm(
            "Delete this product?"
          )
        ) {

          return;

        }


        const {
          error
        } = await supabase
          .from("products")
          .delete()
          .eq("id",id);


        if (error) {

          alert(error.message);

          return;

        }


        await loadProducts();

      };


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        saveButton.disabled =
          true;


        message.textContent =
          "Saving...";


        try {

          const id =
            document.getElementById(
              "productId"
            ).value;


          let imageUrl =
            image.value.trim();


          // Upload new product image if selected

          if (imageFile.files[0]) {

            message.textContent =
              "Uploading product image...";


            imageUrl =
              await uploadProductImage(
                imageFile.files[0]
              );

          }


          const product = {

            name:
              document
                .getElementById("name")
                .value
                .trim(),

            category:
              document
                .getElementById("category")
                .value
                .trim(),

            price:
              Number(
                document
                  .getElementById("price")
                  .value
              ),

            storage:
              document
                .getElementById("storage")
                .value
                .trim(),

            condition:
              document
                .getElementById("condition")
                .value
                .trim(),

            warranty:
              document
                .getElementById("warranty")
                .value
                .trim(),

            stock:
              Number(
                document
                  .getElementById("stock")
                  .value
              ),

            image:
              imageUrl,

            description:
              document
                .getElementById("description")
                .value
                .trim(),

            featured:
              document
                .getElementById("featured")
                .checked,

            active:
              document
                .getElementById("active")
                .checked,

            updated_at:
              new Date().toISOString()

          };


          let result;


          if (id) {

            result =
              await supabase
                .from("products")
                .update(product)
                .eq("id",id);

          } else {

            result =
              await supabase
                .from("products")
                .insert(product);

          }


          if (result.error) {

            throw result.error;

          }


          message.textContent =
            "Product saved successfully.";


          resetForm();


          await loadProducts();


        } catch (error) {

          console.error(error);


          message.textContent =
            "Error: " +
            error.message;

        }


        saveButton.disabled =
          false;

      }
    );


    function resetForm() {

      form.reset();


      document.getElementById(
        "productId"
      ).value = "";


      document.getElementById(
        "active"
      ).checked = true;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Add Product";


      saveButton.textContent =
        "Save Product";


      imagePreview.style.display =
        "none";


      imagePreview.src =
        "";


      message.textContent =
        "";

    }


    cancelButton.addEventListener(
      "click",
      resetForm
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        window.location.href =
          "admin.html";

      }
    );


    const user =
      await checkUser();


    if (user) {

      loadLogo();


      try {

        await loadProducts();

      } catch (error) {

        productsContainer.textContent =
          "Dashboard error: " +
          error.message;

        console.error(error);

      }

    }

  </script>

</body>
</html>
