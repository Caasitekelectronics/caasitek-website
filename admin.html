<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAASITEK Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main style="max-width:520px;margin:10vh auto;padding:25px">

    <a class="brand" href="index.html">
      <span>CT</span> CAASITEK
    </a>

    <h1>Admin Login</h1>
    <p>Sign in to manage your CAASITEK store.</p>

    <form id="loginForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        value="isaacmwale3024@icloud.com"
        required
        style="display:block;width:100%;padding:14px;margin:8px 0 18px"
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        required
        style="display:block;width:100%;padding:14px;margin:8px 0 18px"
      >

      <button class="btn primary" type="submit">
        Sign in
      </button>

    </form>

    <p id="msg"></p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://njvagupehnpmzjxjebfy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_My7phM94P5foLkK565nkXw_Pj8DlShZ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      msg.textContent = "Signing in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        msg.textContent = error.message;
        return;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", data.user.id)
          .single();

      if (profileError || !profile || profile.role !== "admin") {
        await supabaseClient.auth.signOut();
        msg.textContent = "You do not have admin access.";
        return;
      }

      msg.textContent = "Login successful.";

      setTimeout(function() {
        window.location.href = "index.html";
      }, 500);
    });
  </script>

</body>
</html>
